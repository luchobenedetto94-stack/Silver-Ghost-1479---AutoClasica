.tl-item figure{margin-top:14px}

.steps{display:flex;flex-direction:column;gap:18px;padding-top:4px;margin:0;list-style:none;padding-left:0}
.steps li{position:relative;display:flex;gap:14px;align-items:flex-start}
.steps .n{flex-shrink:0;width:32px;height:32px;border:1px solid var(--accent);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:17px;color:var(--accent)}

.next i{font-style:normal;font-size:26px;color:var(--dark-accent)}
.next:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

footer{margin-top:40px;padding:28px 20px 40px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}

.b{position:relative;margin-top:18px}
.b-head{margin-top:44px;display:flex;flex-direction:column;gap:10px}
.b-acc + .b-acc{margin-top:8px}

.hero-wrap{position:relative}
.tl{padding-top:6px}
.tl-item{position:relative}

ieron famoso al 40/50 H.P., en una época en que la mayoría de los autos usaban motores de cuatro cilindros."}, {"t": "acc", "q": "Un chasis, una carrocería a medida", "a": "Rolls-Royce entregaba el 40/50 H.P. como chasis rodante: motor, transmisión y mecánica completos, pero sin carrocería. Laura Pereyra Iraola encargó la del chasis 1479 a Rothschild & Fils, en París. El resultado es un ejemplar único: no existe otro Silver Ghost igual a este."}, {"t": "acc", "q": "Frenar y suspender en 1911", "a": "Como era habitual en la época, el auto no tiene frenos en las ruedas delanteras: un pedal frena sobre la transmisión y los tambores actúan en las ruedas traseras. La suspensión usa ballestas, láminas de acero superpuestas que absorben las irregularidades de caminos que en 1911 rara vez estaban pavimentados."}]}, {"id": "modelo", "tab": "El modelo", "kicker": "02 — El modelo", "title": "El origen de una leyenda", "lede": "Presentado en 1906, el Rolls-Royce 40/50 H.P. «Silver Ghost» fue el automóvil que consolidó el prestigio internacional de la marca.", "hero": "modelo", "stats": [{"v": "1906", "l": "Debut"}, {"v": "6", "l": "Cilindros"}, {"v": "60551", "l": "El primer «Ghost»"}], "blocks": [{"t": "head", "kicker": "La idea", "title": "Suavidad, silencio y confiabilidad"}, {"t": "text", "text": "Henry Royce concibió el 40/50 H.P. con una obsesión: que funcionara con una suavidad y un silencio desconocidos hasta entonces, y que no fallara. La calidad de construcción de cada pieza lo convirtió pronto en la referencia entre los grandes automóviles de su época."}, {"t": "fig", "img": "motor", "cap": "El motor de seis cilindros en línea, corazón del 40/50 H.P."}, {"t": "head", "kicker": "Cronología del modelo", "title": "Cinco años que hicieron una reputación"}, {"t": "tl", "style": "model", "items": [{"year": "1906", "title": "Debut en Londres", "text": "Rolls-Royce presenta el 40/50 H.P., con un motor de seis cilindros de 7.036 cm³."}, {"year": "1907", "title": "Nace el «Silver Ghost»", "text": "El chasis Nº 60551, con acabado plateado, asombra por su silencio y completa exigentes pruebas de resistencia. De él surge el nombre que terminaría identificando a todo el modelo."}, {"year": "1910", "title": "Más cilindrada", "text": "El motor crece a 7.428 cm³, la misma cilindrada que equipa al chasis 1479."}, {"year": "1911", "title": "Referencia mundial", "text": "El 40/50 H.P. ya es reconocido internacionalmente por su confiabilidad, robustez y refinamiento. Ese año se fabrica el chasis 1479."}]}, {"t": "head", "kicker": "Chasis rodante", "title": "Cómo se hacía un Silver Ghost"}, {"t": "text", "text": "Rolls-Royce no vendía autos terminados: entregaba el chasis completo, con motor, transmisión y mecánica. La carrocería quedaba en manos de un especialista elegido por el cliente."}, {"t": "steps", "items": [{"title": "La fábrica", "text": "Rolls-Royce construye y prueba el chasis rodante."}, {"title": "El cliente", "text": "Elige un carrocero independiente y define estilo, uso y terminaciones."}, {"title": "El carrocero", "text": "Construye una carrocería a medida. Por eso muchos 40/50 H.P. son piezas únicas, como el 1479."}]}, {"t": "fig", "img": "chasis", "cap": "Un 40/50 H.P. como salía de fábrica: chasis completo, sin carrocería."}, {"t": "fig", "img": "catalogo", "cap": "Catálogo de época: 40/50 H.P. seis cilindros con carrocería Pullman-de-Luxe."}]}, {"id": "chasis-1479", "tab": "Chasis 1479", "kicker": "03 — El modelo chasis 1479", "title": "La historia viva del chasis 1479", "lede": "En 1911, Laura Pereyra Iraola compró en Londres un Rolls-Royce 40/50 H.P. y encargó su carrocería a Rothschild & Fils. Así nació un ejemplar único que recorrió Europa, cruzó el océano y acompañó a una misma familia durante más de un siglo.", "hero": "chasishero", "stats": [{"v": "115", "l": "Años en la familia"}, {"v": "1", "l": "Ejemplar único"}, {"v": "3", "l": "Hogares"}], "blocks": [{"t": "head", "kicker": "Cronología", "title": "De Londres a AutoClásica"}, {"t": "tl", "style": "big", "items": [{"year": "1911", "text": "Laura Pereyra Iraola compra el auto en Londres y lo hace carrozar en Francia por Rothschild & Fils.", "img": "catalogo", "cap": "Catálogo de época del 40/50 H.P. seis cilindros."}, {"year": "1912", "text": "La familia recorre Europa en el Silver Ghost, de Londres a Moscú, con paradas en Roma y París.", "callout": {"k": "Un viaje que no fue", "text": "La familia tenía pasajes en el Titanic, pero no llegó a subir."}}, {"year": "1913", "text": "El auto llega a la Argentina y se instala en la residencia Pereyra Iraola, en Esmeralda 1212, Buenos Aires.", "img": "palacio", "cap": "La residencia de Esmeralda 1212, Buenos Aires."}, {"year": "1920", "text": "Incorpora el sistema eléctrico oficial de Rolls-Royce, toda una novedad. Se usa para ocasiones especiales, como funciones en el Teatro Colón.", "img": "sepia", "cap": "El chasis 1479 en una fotografía de época."}, {"year": "1973", "text": "Tras más de cinco décadas, se vende la residencia de Esmeralda y el auto se traslada a la Estancia Abril, en la provincia de Buenos Aires."}, {"year": "1995", "text": "Con la venta de la Estancia Abril, el Silver Ghost se muda a la Estancia Langueyú, en Ayacucho."}, {"year": "2026", "text": "Después de 115 años en manos de la misma familia, se presenta al público en AutoClásica.", "img": "color", "cap": "El chasis 1479 en la actualidad."}]}]}, {"id": "fotos", "type": "photos", "tab": "Fotos", "kicker": "04 — Fotos", "title": "El Silver Ghost en imágenes", "lede": "Fotos de época, detalles y el auto hoy. Tocá una foto para verla en grande.", "hero": "", "stats": [], "blocks": []}], "photos": {"cats": [{"id": "epoca", "name": "Época"}, {"id": "detalles", "name": "Detalles"}, {"id": "hoy", "name": "AutoClásica 2026"}], "items": [{"img": "color", "cat": "hoy", "cap": "El chasis 1479 en la actualidad."}, {"img": "sepia", "cat": "epoca", "cap": "El chasis 1479 en una fotografía de época."}, {"img": "palacio", "cat": "epoca", "cap": "La residencia de Esmeralda 1212, Buenos Aires."}, {"img": "catalogo", "cat": "epoca", "cap": "Catálogo de época del 40/50 H.P."}, {"img": "ficha", "cat": "detalles", "cap": "Rueda delantera y guardabarros."}, {"img": "motor", "cat": "detalles", "cap": "El motor de seis cilindros en línea."}, {"img": "chasis", "cat": "detalles", "cap": "El chasis rodante, sin carrocería."}]}, "images": {"ficha": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBQYFBAYGBQYHBwYIChAKCgkJChQODwwQFxQYGBcUFhYaHSUfGhsjHBYWICwgIyYnKSopGR8tMC0oMCUoKSj/2wBDAQcHBwoIChMKChMoGhYaKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCj/wgARCAILBH4DASIAAhEBAxEB/8QAGwAAAwEBAQEBAAAAAAAAAAAAAAECAwQFBgf/xAAXAQEBAQEAAAAAAAAAAAAAAAAAAQID/9oADAMBAAIQAxAAAAH8yYHo1z4Ru+JV0822UQCqrhgjoM+rPKOhVC9+/B1p63jcvnA2aDcG3OmCahpoAABDEDTQADABMEwAAAAAAAAAABpiVSMAAKEA00DCAAABiDtjk0DffA6583ts6ubSumK9bxufrj3pz16c0ZuyiGlEpbUhRJFJIokKUhoRmumd1JXnd/nY3gbRy6ydHZnS08n2M3H28cMa+o8bh8qPb5OC6+l9n5X6PN8/PDkze2MdZHFZVDnSx2qMfWjyc3u6/G9TePO9bzvXt/NnJ0dPN1ZRk0q3w0ziWmMAXXydo+Ps4Y7co7ycY5R0ii5gcgMQAgaAAAAAAGmAAAACGJgxiVSNNAAAqEAMoEqQhokAAKYAAoYmAAAAIH2cYen576jDq5s677k1nLrzjtz9fHzvU3iG4uQRTEwEooQNIGiS5cmshVcPbz8unG+j1uHV6+LlnSEbz2en8v6Z5s/SeFz12a1vKve+a9yOrzvY8mHtrsj5O/BfOz6uBNerz+dfQ4ePpTs9Li9GyPT5fTX8jQtlfQjnnaC89sRAFJoXZx9RXL2Yww5RsKVEgmCExAyRghghoAABiYAIGAAmMAY5BAA0JjDR1ZnGwQWzNaxLK1DBbKzMtxkUVIyVMQADABMAFTEHdXBtGvrcii8ut7zy5Xp0x3rzsd59QT3kSVzQgYgAATlamoLqKKyvOaxrTLh0RemNYX2dh5Xn+341nv8ApfF+pnXL6HmznXoel5m0fUeD7WWHiueSz0OrwTT2+Hm54vNhp0cvq16S35D2+/y+mX8pae56tlxnHTUvjc/Xy2Z0nQ5oWkM6pfIKtecG4BtDECBDAAAAATQAA0DYgTQwBMBhQSxEdBbhfTccu2kEVnrqK5qIz0gmtGZm0GczdStAgpGa0URGwYmkCAlBMEAAUA4foeaz0O7zdzu4unavNjr59YXp8nN2x6U5dOueTFYwLQGKVUEXNW0BJZKWmadXM8b38rrjG/I07cCNjWx83peXz1v1eV1Z19b6Hge/yvxOfueLZnVPQ25tJegwcb9vJ3WbT5/q6er1YaZv5XUm8+8/L2ze58cLPJ081mJpVYnVJnucodfPsYTrgJiG0hiAAAAAAABNCaY20IQMAaYTRqZ1rqLSMzXEit1jRSSBiAYiGWtyFVlCb6clHUsLDHbMR0SYvSSFSJVOXJaqTNMENKAADDTNnrdvzvZHTltzmPXzxvHXlPT0xr0efPTPYTrrMFZ2FJrF <script id="appjs">(function(){

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function get(path){var o=D,ks=path.split('.');for(var i=0;i<ks.length;i++){if(o==null)return undefined;o=o[ks[i]];}return o;}
function set(path,v){var ks=path.split('.'),o=D;for(var i=0;i<ks.length-1;i++)o=o[ks[i]];o[ks[ks.length-1]]=v;}
function parentOf(path){var ks=path.split('.');var i=+ks.pop();return {arr:get(ks.join('.')),i:i,path:ks.join('.')};}
function src(k){return (k&&D.images[k])||'';}
function clone(o){return JSON.parse(JSON.stringify(o));}

/* editable text */
function T(tag,path,cls,ph){
  var v=get(path);
  if(!editing&&!v) return '';
  var c=cls?' class="'+cls+'"':'';
  if(editing) return '<'+tag+c+' contenteditable="plaintext-only" spellcheck="true" data-k="'+path+'" data-ph="'+esc(ph||'Escribí acá')+'">'+esc(v)+'</'+tag+'>';
  return '<'+tag+c+'>'+esc(v)+'</'+tag+'>';
}
function ctl(path,ops){
  if(!editing) return '';
  var m={u:['up','↑','Subir'],d:['down','↓','Bajar'],c:['dup','⧉','Duplicar'],x:['del','✕','Borrar']},h='';
  ops.split('').forEach(function(o){var a=m[o];h+='<button type="button" class="'+a[0]+'" data-act="'+a[0]+'" data-p="'+path+'" title="'+a[2]+'" aria-label="'+a[2]+'">'+a[1]+'</button>';});
  return '<div class="ctl">'+h+'</div>';
}
function addBtn(path,tpl,label){return editing?'<button type="button" class="add" data-act="add" data-p="'+path+'" data-tpl="'+tpl+'">+ '+label+'</button>':'';}
function imgEdit(path,has){
  if(!editing) return '';
  return has?'<button type="button" class="imgbtn" data-act="img" data-p="'+path+'">Cambiar foto</button>':'';
}

var TPL={
  row:{l:'Etiqueta',v:'Valor'}, stat:{v:'00',l:'Dato'},
  tl:{year:'0000',text:'Texto del hito.'}, step:{title:'Paso',text:'Descripción.'},
  head:{t:'head',kicker:'Etiqueta',title:'Título de la sección'},
  text:{t:'text',text:'Escribí el texto acá.'},

function addBlock(path,i){

function figure(imgPath,capPath,alt){
  var k=get(imgPath);
  if(!k&&!editing) return '';
  var h='<figure>';
  if(k) h+='<div class="hero-wrap"><img src="'+src(k)+'" alt="'+esc(alt||get(capPath)||'')+'">'+imgEdit(imgPath,true)+'</div>';
  else h+='<button type="button" class="imgph" data-act="img" data-p="'+imgPath+'">+ Agregar foto</button>';
  h+=T('figcaption',capPath,'','Epígrafe');
  return h+'</figure>';
}

function renderBlock(b,P){
  var h='';
  switch(b.t){
  case 'head': h=T('div',P+'.kicker','kicker','Etiqueta')+T('h2',P+'.title','','Título'); break;

    if(editing) h='<div class="accedit">'+T('div',P+'.q','summary','Título')+T('p',P+'.a','','Texto')+'</div>';

  case 'tl':
    h='<div class="tl'+(b.style==='model'?' tl-model':'')+'">';

      var IP=P+'.items.'+k;
      h+='<div class="tl-item">'+ctl(IP,'udcx');
      if(b.style==='model'){h+=T('div',IP+'.year','tl-year','Año')+T('div',IP+'.title','tl-title','Título');}
      else{h+=T('div',IP+'.year','tl-big','Año');if(it.title||editing)h+=T('div',IP+'.title','tl-title','Título (opcional)');}
      h+=T('p',IP+'.text','','Texto');
      if(it.callout) h+='<div class="callout">'+T('span',IP+'.callout.k','','Etiqueta')+T('b',IP+'.callout.text','','Texto')+'</div>';
      if(it.img) h+=figure(IP+'.img',IP+'.cap');
      if(editing){
        h+='<div class="minirow">'+(it.img?'<button type="button" class="mini" data-act="unset" data-p="'+IP+'.img">Quitar foto</button>':'<button type="button" class="mini" data-act="img" data-p="'+IP+'.img">+ Foto</button>')+
          '<button type="button" class="mini" data-act="callout" data-p="'+IP+'">'+(it.callout?'Quitar destacado':'+ Destacado')+'</button></div>';
      }
      h+='</div>';
    });
    h+='</div>'+addBtn(P+'.items','tl','Agregar hito'); break;
  }
  return '<div class="b b-'+b.t+'">'+ctl(P,'udcx')+h+'</div>';
}

function gallery(){
  var cats=D.photos.cats, items=D.photos.items, h='<div class="chips">';
  if(!editing){
    h+='<button type="button" class="chip" data-act="cat" data-c="all" aria-pressed="'+(galCat==='all')+'">Todas</button>';
    cats.forEach(function(c){h+='<button type="button" class="chip" data-act="cat" data-c="'+esc(c.id)+'" aria-pressed="'+(galCat===c.id)+'">'+esc(c.name)+'</button>';});
  }else{
    cats.forEach(function(c,k){h+='<span class="chip">'+T('span','photos.cats.'+k+'.name','','Categoría')+'<button type="button" class="x" data-act="delcat" data-i="'+k+'" title="Borrar categoría" aria-label="Borrar categoría">✕</button></span>';});
    h+='<button type="button" class="chip" data-act="addcat" style="border-style:dashed;color:var(--accent)">+ Categoría</button>';
  }
  h+='</div>';
  var list=items.map(function(it,k){return {it:it,k:k};}).filter(function(o){return editing||galCat==='all'||o.it.cat===galCat;});
  if(editing) h+='<div style="padding:16px 20px 0"><button type="button" class="add" style="margin-top:0" data-act="addphotos">+ Agregar fotos</button></div>';
  if(!list.length){h+='<p class="empty">Todavía no hay fotos en esta categoría.</p>';return h;}
  h+='<div class="gal">';
  list.forEach(function(o,n){
    var P='photos.items.'+o.k;
    if(editing){
      var opts=cats.map(function(c){return '<option value="'+esc(c.id)+'"'+(c.id===o.it.cat?' selected':'')+'>'+esc(c.name)+'</option>';}).join('');
      h+='<div class="ph">'+ctl(P,'udx')+'<div class="hero-wrap"><img src="'+src(o.it.img)+'" alt="">'+imgEdit(P+'.img',true)+'</div>'+T('div',P+'.cap','cap','Epígrafe')+'<select data-act="setcat" data-p="'+P+'.cat" aria-label="Categoría">'+opts+'</select></div>';
    }else{
      h+='<button type="button" class="ph" data-act="open" data-n="'+n+'"><img src="'+src(o.it.img)+'" alt="'+esc(o.it.cap)+'" loading="lazy"><span class="cap">'+esc(o.it.cap)+'</span></button>';
    }
  });
  return h+'</div>';
}
function visiblePhotos(){return D.photos.items.filter(function(it){return galCat==='all'||it.cat===galCat;});}

function renderSection(s,i){
  var P='sections.'+i, n=D.sections.length, h='<section class="cat" id="'+esc(s.id)+'" aria-labelledby="t-'+esc(s.id)+'">';
  if(s.hero){h+='<div class="hero-wrap"><img class="hero" src="'+src(s.hero)+'" alt="'+esc(s.title)+'">'+imgEdit(P+'.hero',true)+'</div><div class="rule"></div>';}
  else if(editing){h+='<div style="padding:16px 20px 0"><button type="button" class="imgph" style="height:100px" data-act="img" data-p="'+P+'.hero">+ Foto de portada</button></div>';}
  h+='<div class="intro">';
  if(editing) h+='<div class="tabfield">Nombre en el menú: '+T('span',P+'.tab','','Tab')+'</div>';
  h+=T('div',P+'.kicker','kicker','Etiqueta');
  h+=editing?T('h1',P+'.title','','Título').replace('<h1','<h1 id="t-'+esc(s.id)+'"'):'<h1 id="t-'+esc(s.id)+'">'+esc(s.title)+'</h1>';
  h+=T('p',P+'.lede','lede','Bajada');
  h+='</div>';
  if(s.stats&&(s.stats.length||editing)&&s.type!=='photos'){
    h+='<div class="stats">';
    s.stats.forEach(function(st,k){var SP=P+'.stats.'+k;h+='<div class="stat">'+ctl(SP,'udx')+T('b',SP+'.v','','Valor')+T('span',SP+'.l','','Etiqueta')+'</div>';});
    h+='</div>';
    if(editing&&s.stats.length<3) h+='<div style="padding:0 20px">'+addBtn(P+'.stats','stat','Agregar dato')+'</div>';
  }
  if(s.type==='photos') h+=gallery();
  else{
    h+='<div class="blocks">';
    s.blocks.forEach(function(b,j){h+=addBlock(P+'.blocks',j)+renderBlock(b,P+'.blocks.'+j);});
    h+=addBlock(P+'.blocks',s.blocks.length)+'</div>';
  }
  var ni=(i+1)%n, last=i===n-1;
  h+='<a class="next" href="#'+esc(D.sections[ni].id)+'"><div><span>'+(last?'Volver · ':'Siguiente · ')+String(ni+1).padStart(2,'0')+'</span><b>'+esc(last?D.sections[ni].tab:D.sections[ni].title)+'</b></div><i aria-hidden="true">'+(last?'←':'→')+'</i></a>';
  h+='<footer>'+T('b','footer.title','','Título')+T('p','footer.text','','Texto')+'</footer>';
  return h+'</section>';
}

function render(){
  var tr=document.getElementById('track');
  if(tr){[].forEach.call(tr.children,function(p){scrollTops[p.id]=p.scrollTop;});}
  var h='<header class="top"><div class="brand"><b>'+(editing?T('span','brand','','Marca'):esc(D.brand))+' <span>·</span> '+(editing?T('span','brand2','','Detalle'):esc(D.brand2))+'</b>'+(editing?T('small','event','','Evento'):'<small>'+esc(D.event)+'</small>')+'</div><nav class="tabs" aria-label="Secciones">';
  D.sections.forEach(function(s){h+='<a href="#'+esc(s.id)+'" aria-current="false">'+esc(s.tab)+'</a>';});
  h+='<span class="ind" aria-hidden="true"></span></nav></header><main class="track" id="track">';
  D.sections.forEach(function(s,i){h+=renderSection(s,i);});
  h+='</main>';
  app.innerHTML=h;
  document.documentElement.classList.toggle('editing',editing);
  bindTrack();
}

/* ---------- swipe track ---------- */
var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function panels(){return [].slice.call(document.querySelectorAll('#track > .cat'));}
function tabs(){return [].slice.call(document.querySelectorAll('.tabs a'));}
function layoutInd(){
  var tr=document.getElementById('track'),t=tabs(),ind=document.querySelector('.ind');if(!t.length)return;
  var w=t[0].offsetWidth,p=tr.scrollLeft/Math.max(1,tr.clientWidth);
  ind.style.width=w+'px';ind.style.transform='translateX('+(p*w)+'px)';
}
function setActive(i,force){
  if(i===current&&!force) return; current=i;
  tabs().forEach(function(t,k){t.setAttribute('aria-current',k===i?'true':'false');});
  var p=panels()[i]; if(p){try{history.replaceState(null,'','#'+p.id);}catch(e){}}
}
function go(i,smooth){
  var tr=document.getElementById('track'); if(i<0||!tr) return;
  tr.scrollTo({left:i*tr.clientWidth,behavior:(smooth&&!reduce)?'smooth':'auto'});
  setActive(i);
}
function idxOf(hash){var p=panels();for(var i=0;i<p.length;i++){if('#'+p[i].id===hash)return i;}return -1;}
function bindTrack(){
  var tr=document.getElementById('track');
  tr.addEventListener('scroll',function(){layoutInd();var i=Math.round(tr.scrollLeft/Math.max(1,tr.clientWidth));setActive(Math.min(panels().length-1,Math.max(0,i)));},{passive:true});
  panels().forEach(function(p){if(scrollTops[p.id])p.scrollTop=scrollTops[p.id];});
  var start=current>=0?current:Math.max(0,idxOf(location.hash));
  current=-1; go(start,false); layoutInd();
  requestAnimationFrame(function(){go(start,false);layoutInd();});
}
window.addEventListener('resize',function(){if(current>=0)go(current,false);layoutInd();});
window.addEventListener('hashchange',function(){var i=idxOf(location.hash);if(i>=0&&i!==current)go(i,true);});

/* ---------- lightbox ---------- */
var lb=document.createElement('div');lb.className='lb';lb.hidden=true;lb.setAttribute('role','dialog');lb.setAttribute('aria-modal','true');lb.setAttribute('aria-label','Foto');
lb.innerHTML='<div class="lb-top"><span class="lb-count"></span><button type="button" class="lb-x" aria-label="Cerrar">×</button></div><div class="lb-stage"><img alt=""></div><div class="lb-foot"><button type="button" class="lb-nav lb-prev" aria-label="Anterior">←</button><div class="lb-cap"></div><button type="button" class="lb-nav lb-next" aria-label="Siguiente">→</button></div>';
document.body.appendChild(lb);
var lbList=[],lbI=0,lastFocus=null;
function lbShow(){var it=lbList[lbI];lb.querySelector('img').src=src(it.img);lb.querySelector('img').alt=it.cap||'';lb.querySelector('.lb-cap').textContent=it.cap||'';lb.querySelector('.lb-count').textContent=(lbI+1)+' / '+lbList.length;}
function lbOpen(n){lbList=visiblePhotos();if(!lbList.length)return;lbI=n;lastFocus=document.activeElement;lb.hidden=false;lbShow();lb.querySelector('.lb-x').focus();}
function lbClose(){lb.hidden=true;if(lastFocus)lastFocus.focus();}
function lbStep(d){lbI=(lbI+d+lbList.length)%lbList.length;lbShow();}
lb.querySelector('.lb-x').onclick=lbClose;lb.querySelector('.lb-prev').onclick=function(){lbStep(-1);};lb.querySelector('.lb-next').onclick=function(){lbStep(1);};
var sx=null;lb.addEventListener('pointerdown',function(e){sx=e.clientX;});lb.addEventListener('pointerup',function(e){if(sx==null)return;var dx=e.clientX-sx;sx=null;if(Math.abs(dx)>50)lbStep(dx<0?1:-1);});
document.addEventListener('keydown',function(e){if(lb.hidden)return;if(e.key==='Escape')lbClose();else if(e.key==='ArrowRight')lbStep(1);else if(e.key==='ArrowLeft')lbStep(-1);});

/* ---------- editing ---------- */
var fileIn=document.createElement('input');fileIn.type='file';fileIn.accept='image/*';fileIn.hidden=true;document.body.appendChild(fileIn);
function compress(file){return new Promise(function(res,rej){var fr=new FileReader();fr.onload=function(){var im=new Image();im.onload=function(){var s=Math.min(1,1600/Math.max(im.width,im.height));var c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',0.8));};im.onerror=rej;im.src=fr.result;};fr.onerror=rej;fr.readAsDataURL(file);});}
function newKey(){return 'img'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
fileIn.addEventListener('change',function(){
  var files=[].slice.call(fileIn.files||[]);fileIn.value='';if(!files.length)return;
  var path=pendingPath;pendingPath=null;status('Procesando fotos…');
  Promise.all(files.map(compress)).then(function(urls){
    if(path==='__photos'){
      var cat=galCat!=='all'?galCat:(D.photos.cats[0]?D.photos.cats[0].id:'');
      urls.forEach(function(u){var k=newKey();D.images[k]=u;D.photos.items.push({img:k,cat:cat,cap:''});});
    }else{var k=newKey();D.images[k]=urls[0];set(path,k);}
    markDirty();render();updateSize();
  }).catch(function(){status('No se pudo leer la imagen.',true);});
});

function markDirty(){dirty=true;var b=document.querySelector('.ebar .save');if(b)b.disabled=false;}
var ebar=null,efab=null;
function status(msg,err){var s=ebar&&ebar.querySelector('.info span');if(s){s.textContent=msg;s.className=err?'err':'';}}
function usedImages(){var used={};JSON.stringify(D,function(k,v){if(k==='images')return undefined;if(typeof v==='string'&&Object.prototype.hasOwnProperty.call(D.images,v))used[v]=1;return v;});var o={};Object.keys(used).forEach(function(k){o[k]=D.images[k];});return o;}
function buildDoc(){
  var data=clone(D);data.images=usedImages();
  var json=JSON.stringify(data).replace(/</g,'\\u003c');
  var css=document.getElementById('css').textContent, js=document.getElementById('appjs').textContent;
  return '<!doctype html>\n<html lang="es">\n<head>\n'+HEAD+'<title>'+esc(D.meta.title)+'</title>\n<style id="css">'+css+'</style>\n</head>\n<body>\n<div class="wrap" id="app"></div>\n<script type="application/json" id="data">'+json+'<\/script>\n<script id="appjs">'+js+'<\/script>\n</body>\n</html>\n';
}
function updateSize(){var n=new Blob([buildDoc()]).size;status((n/1048576).toFixed(1).replace('.',',')+' MB de 16 MB usados'+(n>MAX?' · demasiado pesado: quitá fotos':''),n>MAX);return n;}
function enterEdit(){
  editing=true;efab.hidden=true;render();
  ebar=document.createElement('div');ebar.className='ebar';
  ebar.innerHTML='<div class="info"><b>Modo edición</b><span></span></div><button type="button" data-act="discard">Descartar</button><button type="button" class="primary save" data-act="save" disabled>Guardar y publicar</button>';
  document.body.appendChild(ebar);updateSize();
}
function exitEdit(){editing=false;dirty=false;if(ebar){ebar.remove();ebar=null;}efab.hidden=false;render();}
window.addEventListener('beforeunload',function(e){if(dirty&&!saving){e.preventDefault();e.returnValue='';}});

function save(){
  var n=updateSize();if(n>MAX)return;
  var btn=ebar.querySelector('.save');btn.disabled=true;saving=true;status('Publicando…');
  var html=buildDoc();
  ART.publish(html).then(function(){dirty=false;status('¡Publicado! Recargando…');}).catch(function(e){
    saving=false;btn.disabled=false;var c=e&&e.code;
    if(c==='conflict'){dirty=false;status('Había una versión más nueva; se recarga la página.',true);}
    else if(c==='too_large'){status('La página es demasiado pesada. Quitá algunas fotos.',true);}
    else if(c==='rate_limited'){status('Demasiados guardados seguidos. Esperá un minuto.',true);}
    else if(c==='not_writer'||c==='not_granted'||c==='capability_disabled'||c==='not_declared'){status('Esta vista no puede guardar. Abrí la página desde tu cuenta de Claude.',true);}
    else{status('No se pudo publicar. Probá de nuevo.',true);}
  });
}

/* ---------- events ---------- */
document.addEventListener('input',function(e){
  var el=e.target; if(!el.getAttribute) return; var k=el.getAttribute('data-k'); if(!k) return;
  var v=el.innerText.replace(/\s*\n\s*/g,' ').replace(/\u00a0/g,' ');
  if(v.trim()==='')v='';
  set(k,v);markDirty();
  if(/^sections\.\d+\.tab$/.test(k)){var i=+k.split('.')[1];var t=tabs()[i];if(t)t.textContent=v;}
});
document.addEventListener('paste',function(e){var el=e.target.closest&&e.target.closest('[data-k]');if(!el)return;e.preventDefault();var t=(e.clipboardData||window.clipboardData).getData('text');document.execCommand('insertText',false,t);});
document.addEventListener('change',function(e){
  var el=e.target,a=el.getAttribute&&el.getAttribute('data-act');if(!a)return;
  if(a==='addblock'&&el.value){var arr=get(el.getAttribute('data-p'));arr.splice(+el.getAttribute('data-i'),0,clone(TPL[el.value]));markDirty();render();}
  else if(a==='setcat'){set(el.getAttribute('data-p'),el.value);markDirty();}
});
document.addEventListener('click',function(e){
  var t=e.target.closest&&e.target.closest('[data-act],a[href^="#"]'); if(!t) return;
  if(t.tagName==='A'){var i=idxOf(t.getAttribute('href'));if(i<0)return;e.preventDefault();if(t.classList.contains('next'))panels()[i].scrollTop=0;go(i,true);return;}
  var a=t.getAttribute('data-act'),p=t.getAttribute('data-p');
  if(a==='addblock'||a==='setcat') return;
  if(a==='open'){lbOpen(+t.getAttribute('data-n'));return;}
  if(a==='cat'){galCat=t.getAttribute('data-c');render();return;}
  if(a==='edit'){enterEdit();return;}
  if(!editing) return;
  if(a==='discard'){if(dirty&&!confirm('¿Descartar los cambios sin guardar?'))return;D=JSON.parse(ORIG);exitEdit();return;}
  if(a==='save'){save();return;}
  if(a==='img'){pendingPath=p;fileIn.multiple=false;fileIn.click();return;}
  if(a==='addphotos'){pendingPath='__photos';fileIn.multiple=true;fileIn.click();return;}
  var q;
  if(a==='up'||a==='down'){q=parentOf(p);var j=q.i+(a==='up'?-1:1);if(j<0||j>=q.arr.length)return;var x=q.arr[q.i];q.arr[q.i]=q.arr[j];q.arr[j]=x;}
  else if(a==='dup'){q=parentOf(p);q.arr.splice(q.i+1,0,clone(q.arr[q.i]));}
  else if(a==='del'){q=parentOf(p);q.arr.splice(q.i,1);}
  else if(a==='add'){get(p).push(clone(TPL[t.getAttribute('data-tpl')]));}
  else if(a==='unset'){set(p,'');}
  else if(a==='callout'){var it=get(p);if(it.callout)delete it.callout;else it.callout={k:'Destacado',text:'Texto destacado.'};}
  else if(a==='addcat'){var nm=prompt('Nombre de la nueva categoría');if(!nm)return;D.photos.cats.push({id:'c'+Date.now().toString(36),name:nm.trim()});}
  else if(a==='delcat'){var ci=+t.getAttribute('data-i'),cats=D.photos.cats;if(cats.length<2){alert('Tiene que quedar al menos una categoría.');return;}var cid=cats[ci].id;if(!confirm('¿Borrar la categoría «'+cats[ci].name+'»? Sus fotos pasan a «'+cats[ci===0?1:0].name+'».'))return;var to=cats[ci===0?1:0].id;D.photos.items.forEach(function(it){if(it.cat===cid)it.cat=to;});cats.splice(ci,1);if(galCat===cid)galCat='all';}
  else return;
  markDirty();render();if(a==='del'||a==='unset'||a==='dup')updateSize();
});

/* ---------- boot ---------- */
render();
efab=document.createElement('button');efab.type='button';efab.className='efab';efab.setAttribute('data-act','edit');efab.textContent='✎ Editar';efab.hidden=true;document.body.appendChild(efab);
if(window.claude&&typeof window.claude.use==='function'){
  Promise.all([window.claude.use('user'),window.claude.use('artifact')]).then(function(r){
    var u=r[0],a=r[1];if(!u||!a)return;
    return u.canEdit().then(function(ok){if(ok){ART=a;efab.hidden=false;}});
  }).catch(function(){});
}
})();
</script>
</body>
